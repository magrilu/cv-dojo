project:
  type: website
  output-dir: _site

website:
  title: "Computer Vision Dojo: a geometric way"
  description: "Hands-on notebooks in geometric computer vision."
  site-url: https://magrilu.github.io/cv-dojo/
  repo-url: https://github.com/magrilu/cv-dojo
  repo-actions: [issue]
  favicon: assets/favicon.png
  page-footer:
    left: "© 2026 Luca Magri — CC BY-NC-ND 4.0 (text and figures) / MIT (code)"
    right:
      - icon: github
        href: https://github.com/magrilu/cv-dojo
      - text: "magrilu.github.io"
        href: https://magrilu.github.io/
  navbar:
    left:
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/magrilu/cv-dojo
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Preface
      - href: origami-house.qmd
        text: "The Origami house"
      - section: "Geometry fundamentals"
        contents:
          - notebooks/geometry/fitting-a-conic.ipynb
      - section: "Single-view geometry"
        contents:
          - notebooks/camera/projection.ipynb
          - notebooks/camera/camera.ipynb
          - notebooks/rectification/affine.ipynb
      - section: "Two-view geometry"
        contents:
          - notebooks/two-views/fundamental-matrix.ipynb
          - notebooks/two-views/eight-point.ipynb
          - notebooks/two-views/residuals.ipynb
          - notebooks/two-views/seven-point.ipynb
      - section: "Reconstruction"
        contents:
          - notebooks/reconstruction/triangulation.ipynb

format:
  html:
    theme: [cosmo, assets/custom.scss]
    toc: true
    toc-depth: 3
    toc-title: " "
    code-tools: true
    code-fold: false
    highlight-style: github
    fig-align: center

execute:
  enabled: true
  freeze: auto

bibliography: references.bib
